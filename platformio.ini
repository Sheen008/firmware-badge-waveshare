[platformio]
; Optional local overrides (gitignored): reuse an already-downloaded
; toolchain instead of re-downloading it. See platformio.local.ini.example.
extra_configs = platformio.local.ini

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.20
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
; Partition scheme with two OTA slots (app0/app1): required for Wi-Fi flashing
board_build.partitions = default_16MB.csv

; Native USB CDC disabled: GPIO 19/20 (USB D-/D+) are used as buttons.
; Flash + logs go through the CH343 UART bridge (Serial0), as before.
build_flags =
    -D BOARD_HAS_PSRAM

monitor_speed = 115200

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0
    https://github.com/MaliosDark/Arduino_GC9B72.git
    links2004/WebSockets@^2.4.1
; Cable-free flashing (Wi-Fi OTA): hold the PREV button (GPIO 20) while
; powering on -> the badge creates the "badge-threejs" network and shows
; the info. Connect the Mac to that Wi-Fi then:  pio run -e ota -t upload
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = 192.168.4.1

; Waveshare ESP32-S3-Touch-AMOLED-1.75C: 1.75" round AMOLED 466x466
; (CO5300 QSPI) + CST9217 touch + AXP2101 PMIC. Native USB for flashing
; and logs (CDC on boot). See the WAVESHARE_175C branches in src/main.cpp.
[env:waveshare-175c]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.20
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi ; ESP32-S3R8: QIO flash + octal PSRAM
board_build.flash_size = 32MB
board_build.partitions = default_32MB.csv

build_flags =
    -D BOARD_HAS_PSRAM
    -D WAVESHARE_175C
    -D UI_TS=1.30f
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

; To reuse an already-downloaded toolchain instead of re-downloading it, add
; a platform_packages block with symlink:// entries pointing at your local
; ~/.platformio/tools and ~/.platformio/packages paths.

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.4 ; Arduino_ESP32QSPI + Arduino_CO5300
    links2004/WebSockets@^2.4.1

; First prototype (flying wires, wired before 2026-08-14): old screen
; mapping SCLK 12 / MOSI 11 / DC 13 / RST 14 and battery gauge on 5/6.
; Same firmware, only the GPIOs change:  pio run -e proto -t upload
[env:proto]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D PROTO_V1_WIRING
